[project]
name = "ErisPulse-WechatMpAdapter"
version = "4.0.0"
description = "ErisPulse的微信公众号(WechatMp)适配模块"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "ErisPulse" } ]
dependencies = ["cryptography"]

[project.urls]
"homepage" = "https://github.com/ErisPulse/ErisPulse-WechatMpAdapter"

[project.entry-points."erispulse.adapter"]
mp = "WechatMpAdapter:WechatMpAdapter"
wechat_mp = "WechatMpAdapter:WechatMpAdapter"

[tool.setuptools.packages.find]
include = [ "WechatMpAdapter" ]
